<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics Math Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --mcm-espresso: #121212;
            --mcm-charcoal: #1e1e1e;
            --mcm-brass: #c5a059;
            --mcm-gold-dim: #8e7037;
            --casino-forest: #1a3a32;
            --casino-cherry: #8b0000;
            --text-off-white: #d1d5db;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: var(--mcm-espresso);
            color: var(--text-off-white);
            padding: 30px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            letter-spacing: -0.01em;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--mcm-charcoal);
            padding: 16px 24px;
            border-radius: 4px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            border-bottom: 2px solid var(--mcm-brass);
        }
        .modes-tabs {
            display: flex;
            gap: 12px;
        }
        .tab {
            background-color: transparent;
            border: 1px solid #333;
            color: #6b7280;
            padding: 8px 20px;
            border-radius: 2px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab.active {
            color: var(--mcm-brass);
            border-color: var(--mcm-brass);
            background-color: rgba(197, 160, 89, 0.05);
        }
        .balance-info {
            background-color: var(--casino-forest);
            border-left: 3px solid var(--mcm-brass);
            color: #fff;
            padding: 10px 20px;
            border-radius: 1px;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.05em;
        }
        .main-container {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 30px;
            flex-grow: 1;
        }
        .left-panel {
            background-color: var(--mcm-charcoal);
            border-radius: 4px;
            padding: 40px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 35px;
            position: relative;
            border: 1px solid #2a2a2a;
        }
        .wheel-controller {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 15px 10px;
            border: 1px solid #2a2a2a;
            border-left: 2px solid var(--mcm-brass);
            border-radius: 2px;
            gap: 12px;
            flex-shrink: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .wheel-controller.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            width: 0;
            padding: 0;
            margin: 0;
            border: none;
        }
        .wheel-ctrl-btn {
            background-color: transparent;
            border: 1px solid #444;
            color: var(--text-off-white);
            font-size: 18px;
            font-weight: bold;
            width: 36px;
            height: 36px;
            cursor: pointer;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .wheel-ctrl-btn:hover {
            color: var(--mcm-brass);
            border-color: var(--mcm-brass);
            background-color: rgba(197, 160, 89, 0.05);
        }
        .wheel-count-input {
            width: 45px;
            background: var(--mcm-espresso);
            border: 1px solid #333;
            color: var(--mcm-brass);
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            padding: 6px 0;
            border-radius: 2px;
            outline: none;
        }
        .wheel-count-input::-webkit-outer-spin-button,
        .wheel-count-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .wheel-display-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }
        .wheel-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px 20px; 
            width: 100%;
            flex-grow: 1;
        }
        .wheel-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .wheel-tick {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 14px solid var(--mcm-brass);
            z-index: 20;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            pointer-events: none;
        }
        .wheel {
            border-radius: 50%;
            border: 5px solid var(--mcm-charcoal);
            outline: 1px solid var(--mcm-gold-dim);
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            position: relative;
            transition: background 0.3s ease, width 0.3s ease, height 0.3s ease, transform 3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .wheel-highlight {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            z-index: 10;
            pointer-events: none;
            background: transparent;
            transition: background 0.3s ease;
        }
        .wheel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16%;
            height: 16%;
            background: var(--mcm-brass);
            border-radius: 50%;
            border: 2px solid var(--mcm-espresso);
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            z-index: 15;
        }
        .wheel-label-tag {
            font-size: 10px;
            color: var(--mcm-brass);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 6px;
            text-align: center;
        }
        .spin-btn {
            background-color: var(--casino-cherry);
            color: white;
            border: none;
            padding: 14px 50px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 2px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: 1px solid transparent;
            flex-shrink: 0;
        }
        .spin-btn:hover:not(:disabled) {
            background-color: transparent;
            color: var(--mcm-brass);
            border-color: var(--mcm-brass);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.2);
        }
        .spin-btn:disabled {
            background-color: #3a1111;
            color: #52525b;
            border-color: transparent;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.4; /* Visually dims the button to match the field lockout aesthetics */
        }
        .right-panel {
            background-color: var(--mcm-charcoal);
            border-radius: 4px;
            padding: 35px;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .right-panel::before {
            content: '';
            position: absolute;
            top: -1px;
            right: -1px;
            width: 40px;
            height: 40px;
            border-top: 2px solid var(--mcm-brass);
            border-right: 2px solid var(--mcm-brass);
        }
        .question-header {
            font-size: 12px;
            font-weight: 800;
            color: var(--mcm-brass);
            padding-bottom: 12px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            border-bottom: 1px solid #333;
        }
        .question-content {
            flex-grow: 1;
            background-color: rgba(0,0,0,0.2);
            border-radius: 2px;
            padding: 25px;
            color: #9ca3af;
            font-weight: 300;
            line-height: 1.8;
            font-size: 16px;
            border-left: 2px solid var(--casino-forest);
        }
        .color-selector-list {
            list-style: none;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .color-selector-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid #2d2d2d;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 400;
            font-size: 14px;
            color: #9ca3af;
        }
        .color-selector-item:hover {
            border-color: #555;
            background-color: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        .color-selector-item.selected {
            border-color: var(--mcm-brass);
            background-color: rgba(197, 160, 89, 0.08);
            color: #fff;
            font-weight: 600;
        }
        .color-swatch-badge {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .shade-slice {
            display: inline-block;
            width: 20px;
            height: 20px;
            clip-path: polygon(50% 100%, 15% 0%, 85% 0%);
            vertical-align: middle;
            margin: 0 4px;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
        }
        .bet-container {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #333;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: opacity 0.3s ease;
        }
        .bet-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .bet-input {
            background: var(--mcm-espresso);
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 2px;
            outline: none;
            width: 120px;
        }
        .bet-input:focus {
            border-color: var(--mcm-brass);
        }
        .outcome-banner {
            margin-top: 15px;
            padding: 10px 15px;
            font-weight: 600;
            font-size: 14px;
            border-radius: 2px;
            text-align: center;
        }
        .outcome-win {
            background-color: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid #10b981;
        }
        .outcome-draw {
            background-color: rgba(197, 160, 89, 0.15);
            color: var(--mcm-brass);
            border: 1px solid var(--mcm-brass);
        }
        .outcome-loss {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid #ef4444;
        }
        footer {
            margin-top: 30px;
            background-color: #000;
            color: var(--mcm-brass);
            text-align: center;
            padding: 18px;
            border-radius: 4px;
            font-weight: 400;
            font-size: 11px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            border: 1px solid #1a1a1a;
        }
    </style>
</head>
<body>

    <header>
        <div class="modes-tabs">
            <div class="tab" data-mode="shades">Shades</div>
            <div class="tab" data-mode="multicolor">Multicolor</div>
        </div>
        <div class="balance-info" id="balance-display">
            Balance: $1,000.00
        </div>
    </header>

    <main class="main-container">
        <section class="left-panel">
            <div class="wheel-controller" id="ctrl-panel">
                <button class="wheel-ctrl-btn" id="btn-add-wheel">+</button>
                <input type="number" class="wheel-count-input" id="wheel-count" value="2" min="1" max="12">
                <button class="wheel-ctrl-btn" id="btn-sub-wheel">−</button>
            </div>

            <div class="wheel-display-area">
                <div class="wheel-container" id="container-wheels"></div>
                <button class="spin-btn">Spin</button>
            </div>
        </section>

        <section class="right-panel">
            <div class="question-header">Shades mode</div>
            <div class="question-content" id="prompt-content">
                The layout parameters will appear here...
            </div>
        </section>
    </main>

    <script>
        const tabs = document.querySelectorAll('.tab');
        const promptContent = document.getElementById('prompt-content');
        const spinBtn = document.querySelector('.spin-btn');
        const wheelContainer = document.getElementById('container-wheels');
        const wheelCountInput = document.getElementById('wheel-count');
        const ctrlPanel = document.getElementById('ctrl-panel');
        const btnAddWheel = document.getElementById('btn-add-wheel');
        const btnSubWheel = document.getElementById('btn-sub-wheel');
        const balanceDisplay = document.getElementById('balance-display');

        const totalSectors = 12;
        const degreesPerSector = 360 / totalSectors;

        const colorPalette = [
            { id: 0, name: "Green", color: "#10b981" },
            { id: 1, name: "Blue", color: "#3b82f6" },
            { id: 2, name: "Red", color: "#ef4444" },
            { id: 3, name: "Yellow", color: "#f59e0b" },
            { id: 4, name: "Purple", color: "#8b5cf6" },
            { id: 5, name: "Orange", color: "#f97316" },
            { id: 6, name: "Pink", color: "#ec4899" },
            { id: 7, name: "Cyan", color: "#06b6d4" }
        ];
        let fakeBalance = 1000.00;
        let currentMode = 'shades';
        let isSpinning = false;

        let currentShadesHue = Math.floor(Math.random() * 360);
        let currentMulticolorPercentages = generateRandomPercentages(8);
        let currentBottomWheelPercentages = generateRandomPercentages(4); 
        let selectedMulticolorIndex = 0; 
        let bottomWheelPickedColors = []; 
        let currentBetAmount = 0;
        let savedScenariosCount = 2; 

        const originalGradient = `conic-gradient(
            from 0deg,
            var(--mcm-espresso) 0deg 45deg,
            var(--casino-forest) 45deg 90deg,
            var(--mcm-espresso) 90deg 135deg,
            var(--casino-cherry) 135deg 180deg,
            var(--mcm-espresso) 180deg 225deg,
            var(--casino-forest) 225deg 270deg,
            var(--mcm-espresso) 270deg 315deg,
            var(--casino-cherry) 315deg 360deg
        )`;

        function updateBalanceUI() {
            balanceDisplay.innerText = `Balance: $${fakeBalance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function buildWheels() {
            wheelContainer.innerHTML = '';
            let targetCount = 1;

            if (currentMode === 'scenarios') {
                ctrlPanel.classList.remove('hidden');
                targetCount = parseInt(wheelCountInput.value) || 1;
                if (targetCount < 1) { targetCount = 1; wheelCountInput.value = 1; }
                if (targetCount > 12) { targetCount = 12; wheelCountInput.value = 12; }
                savedScenariosCount = targetCount;
            } else if (currentMode === 'shades') {
                ctrlPanel.classList.add('hidden');
                targetCount = 1; 
            } else if (currentMode === 'multicolor') {
                ctrlPanel.classList.add('hidden');
                targetCount = 2; 
            }

            let targetSize = 175;
            if (currentMode === 'scenarios') {
                if (targetCount > 8) targetSize = 90;
                else if (targetCount > 4) targetSize = 115;
                else if (targetCount > 2) targetSize = 140;
            } else if (currentMode === 'multicolor') {
                targetSize = 155;
            }

            for (let i = 0; i < targetCount; i++) {
                const wrapper = document.createElement('div');
                wrapper.classList.add('wheel-wrapper');

                const tickEl = document.createElement('div');
                tickEl.classList.add('wheel-tick');

                const wheelEl = document.createElement('div');
                wheelEl.classList.add('wheel');
                wheelEl.style.width = `${targetSize}px`;
                wheelEl.style.height = `${targetSize}px`;
                wheelEl.dataset.rotation = "0";
                const highlightEl = document.createElement('div');
                highlightEl.classList.add('wheel-highlight');

                wheelEl.appendChild(highlightEl);
                wrapper.appendChild(tickEl);
                wrapper.appendChild(wheelEl);

                if (currentMode === 'multicolor') {
                    const label = document.createElement('div');
                    label.classList.add('wheel-label-tag');
                    label.innerText = i === 0 ? "Left Wheel" : "Right Wheel";
                    wrapper.appendChild(label);
                }

                wheelContainer.appendChild(wrapper);
            }

            applyWheelMode(currentMode);
        }

        btnAddWheel.addEventListener('click', () => {
            if (isSpinning) return; 
            wheelCountInput.value = parseInt(wheelCountInput.value) + 1;
            buildWheels();
        });
        btnSubWheel.addEventListener('click', () => {
            if (isSpinning) return; 
            wheelCountInput.value = parseInt(wheelCountInput.value) - 1;
            buildWheels();
        });
        wheelCountInput.addEventListener('change', () => {
            if (isSpinning) return; 
            buildWheels();
        });
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                if (isSpinning) return; 
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentMode = tab.getAttribute('data-mode');
                buildWheels();
            });
        });

        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;

            // MULTICOLOR BET HANDLING
            if (currentMode === 'multicolor') {
                const betInput = document.getElementById('mcm-bet-field');
                let parsedBet = parseFloat(betInput.value) || 0;

                if (parsedBet <= 0) {
                    alert("Please enter a valid fake token allocation amount greater than 0.");
                    return;
                }
                if (parsedBet > fakeBalance) {
                    alert("You don't have enough money for that configuration size!");
                    return;
                }

                currentBetAmount = parsedBet;
                fakeBalance -= currentBetAmount;
                updateBalanceUI();

                const oldBanner = document.querySelector('.outcome-banner');
                if (oldBanner) oldBanner.remove();
            }

            // SHADES MODE LOCK
            if (currentMode === 'shades') {
                if (!window.activeShadesBet) {
                    alert("Solve the probability metric first before triggering a spin.");
                    return;
                }

                const liveBetInput = document.getElementById('shades-bet-field');
                let betAmount = parseFloat(liveBetInput.value) || 0;

                if (betAmount <= 0) {
                    alert("Enter a valid metric allocation amount.");
                    return;
                }
                if (betAmount > fakeBalance) {
                    alert("Insufficient credit depth.");
                    return;
                }

                currentBetAmount = betAmount;
                fakeBalance -= currentBetAmount;
                updateBalanceUI();

                // Gray out the full wrapper panel and spin button during wheel animation
                const shadesBetArea = document.getElementById('shades-bet-area');
                if (shadesBetArea && liveBetInput) {
                    liveBetInput.disabled = true;
                    shadesBetArea.style.opacity = "0.4";
                    shadesBetArea.style.cursor = "not-allowed";
                    liveBetInput.style.cursor = "not-allowed";
                }

                const oldBanner = promptContent.querySelector('.outcome-banner');
                if (oldBanner) oldBanner.remove();
            }

            isSpinning = true;
            spinBtn.disabled = true;
            const dynamicWheels = document.querySelectorAll('.wheel');
            let wheelFinalAngles = [];

            dynamicWheels.forEach((wheel) => {
                const randomOffset = Math.floor(Math.random() * 360);
                const completeSpins = 1440;
                let currentRot = parseInt(wheel.dataset.rotation) || 0;
                let targetRot = currentRot + completeSpins + randomOffset;
                wheel.dataset.rotation = targetRot;
                wheel.style.transform = `rotate(${targetRot}deg)`;
                let landingAngle = (targetRot % 360);
                wheelFinalAngles.push(landingAngle);
            });

            setTimeout(() => {
                // MULTICOLOR RESULT
                if (currentMode === 'multicolor') {
                    evaluateMulticolorResult(wheelFinalAngles);
                }

                // SHADES RESULT
                if (currentMode === 'shades') {
                    let pointerAngle = (360 - (wheelFinalAngles[0] % 360)) % 360;
                    let landedSector = Math.floor(pointerAngle / degreesPerSector);
                    let won = false;

                    if (window.activeShadesBet.condition === 'darker') {
                        won = landedSector < window.activeShadesBet.targetIndex;
                    } else {
                        won = landedSector > window.activeShadesBet.targetIndex;
                    }

                    let banner = document.createElement('div');
                    banner.classList.add('outcome-banner');

                    if (won) {
                        let winnings = currentBetAmount * 2;
                        fakeBalance += winnings;
                        banner.classList.add('outcome-win');
                        banner.innerText = `Result Verified! Returned ${currentBetAmount} CR! Total payout processed was ${winnings} CR.`;
                    } else {
                        banner.classList.add('outcome-loss');
                        banner.innerText = `Loss registered. Deducted ${currentBetAmount} CR from workspace balance.`;
                    }

                    updateBalanceUI();
                    promptContent.appendChild(banner);
                    window.activeShadesBet = null;
                }

                currentShadesHue = Math.floor(Math.random() * 360);
                currentMulticolorPercentages = generateRandomPercentages(8);
                currentBottomWheelPercentages = generateRandomPercentages(4);

                applyWheelMode(currentMode);
                isSpinning = false;
                spinBtn.disabled = false;
            }, 3000);
        });

        function generateRandomPercentages(count) {
            let rawWeights = [];
            let totalRaw = 0;
            for (let i = 0; i < count; i++) {
                let weight = Math.floor(Math.random() * 85) + 15;
                rawWeights.push(weight);
                totalRaw += weight;
            }
            let percentages = rawWeights.map(w => Math.round((w / totalRaw) * 100));
            let sum = percentages.reduce((a, b) => a + b, 0);
            let diff = 100 - sum;
            percentages[0] += diff;
            return percentages;
        }

        function highlightMulticolorSectors() {
            const dynamicWheels = document.querySelectorAll('.wheel');
            if (dynamicWheels.length < 2) return;

            const highlightTop = dynamicWheels[0].querySelector('.wheel-highlight');
            const highlightBottom = dynamicWheels[1].querySelector('.wheel-highlight');

            let topStartAngle = 0;
            colorPalette.forEach((item, index) => {
                const pct = currentMulticolorPercentages[index];
                const angleSpan = (pct / 100) * 360;
                if (index === selectedMulticolorIndex) {
                    const topEndAngle = topStartAngle + angleSpan;
                    highlightTop.style.background = `conic-gradient(
                        from 0deg,
                        transparent 0deg ${topStartAngle.toFixed(1)}deg,
                        var(--mcm-brass) ${topStartAngle.toFixed(1)}deg ${(topStartAngle + 2).toFixed(1)}deg,
                        transparent ${(topStartAngle + 2).toFixed(1)}deg ${(topEndAngle - 2).toFixed(1)}deg,
                        var(--mcm-brass) ${(topEndAngle - 2).toFixed(1)}deg ${topEndAngle.toFixed(1)}deg,
                        transparent ${topEndAngle.toFixed(1)}deg 360deg
                    )`;
                }
                topStartAngle += angleSpan;
            });
            let bIndex = bottomWheelPickedColors.indexOf(selectedMulticolorIndex);
            if (bIndex !== -1) {
                let bStartAngle = 0;
                for (let i = 0; i < bIndex; i++) {
                    bStartAngle += (currentBottomWheelPercentages[i] / 100) * 360;
                }
                const bAngleSpan = (currentBottomWheelPercentages[bIndex] / 100) * 360;
                const bEndAngle = bStartAngle + bAngleSpan;

                highlightBottom.style.background = `conic-gradient(
                    from 0deg,
                    transparent 0deg ${bStartAngle.toFixed(1)}deg,
                    var(--mcm-brass) ${bStartAngle.toFixed(1)}deg ${(bStartAngle + 2).toFixed(1)}deg,
                    transparent ${(bStartAngle + 2).toFixed(1)}deg ${(bEndAngle - 2).toFixed(1)}deg,
                    var(--mcm-brass) ${(bEndAngle - 2).toFixed(1)}deg ${bEndAngle.toFixed(1)}deg,
                    transparent ${bEndAngle.toFixed(1)}deg 360deg
                )`;
            } else {
                highlightBottom.style.background = 'transparent';
            }
        }

        function evaluateMulticolorResult(angles) {
            if(angles.length < 2) return;
            let pointerAngleLeft = (360 - (angles[0] % 360)) % 360;
            let pointerAngleRight = (360 - (angles[1] % 360)) % 360;
            let currentAngleSumLeft = 0;
            let landedIndexLeft = 0;
            for (let i = 0; i < colorPalette.length; i++) {
                let span = (currentMulticolorPercentages[i] / 100) * 360;
                if (pointerAngleLeft >= currentAngleSumLeft && pointerAngleLeft < currentAngleSumLeft + span) {
                    landedIndexLeft = i;
                    break;
                }
                currentAngleSumLeft += span;
            }

            let currentAngleSumRight = 0;
            let landedIndexRight = -1;
            for (let i = 0; i < bottomWheelPickedColors.length; i++) {
                let span = (currentBottomWheelPercentages[i] / 100) * 360;
                if (pointerAngleRight >= currentAngleSumRight && pointerAngleRight < currentAngleSumRight + span) {
                    landedIndexRight = bottomWheelPickedColors[i];
                    break;
                }
                currentAngleSumRight += span;
            }

            let matches = 0;
            if (landedIndexLeft === selectedMulticolorIndex) matches++;
            if (landedIndexRight === selectedMulticolorIndex) matches++;

            let winnings = 0;
            let outcomeMessage = "";
            let bannerClass = "";

            if (matches === 0) {
                winnings = 0;
                outcomeMessage = `0 layouts matched. Relinquished your simulated allocation of ${currentBetAmount} CR!`;
                bannerClass = "outcome-loss";
            } else if (matches === 1) {
                winnings = currentBetAmount;
                outcomeMessage = `1 structural alignment matched! Balanced out cleanly; retained your ${currentBetAmount} CR token.`;
                bannerClass = "outcome-draw";
            } else if (matches === 2) {
                winnings = currentBetAmount * 2;
                outcomeMessage = `Perfect Double Hit! Both dynamic segments aligned. Credited with ${winnings} CR! (+${currentBetAmount} CR net progress)`;
                bannerClass = "outcome-win";
            }

            fakeBalance += winnings;
            updateBalanceUI();
            const banner = document.createElement('div');
            banner.classList.add('outcome-banner', bannerClass);
            banner.innerText = outcomeMessage;
            promptContent.appendChild(banner);
        }

        function applyWheelMode(mode) {
            const dynamicWheels = document.querySelectorAll('.wheel');
            dynamicWheels.forEach(wheel => {
                const ring = wheel.querySelector('.wheel-highlight');
                if (ring) ring.style.background = 'transparent';
            });
            if (mode === 'scenarios') {
                promptContent.style.whiteSpace = "normal";
                dynamicWheels.forEach(wheel => wheel.style.background = originalGradient);
                promptContent.innerText = "Simulated environments active. Use the counter metrics inside the control pane node to map out layouts concurrently.";
                spinBtn.disabled = false;
            } 
            else if (mode === 'shades') {
                const randomSectorIndex = Math.floor(Math.random() * totalSectors);
                const targetedLightness = 12 + (randomSectorIndex * (76 / (totalSectors - 1)));
                const pulledShadeColor = `hsl(${currentShadesHue}, 65%, ${targetedLightness}%)`;
                
                dynamicWheels.forEach((wheel) => {
                    let gradientStrings = [];
                    for (let i = 0; i < totalSectors; i++) {
                        const lightness = 12 + (i * (76 / (totalSectors - 1)));
                        const colorString = `hsl(${currentShadesHue}, 65%, ${lightness}%)`;
                        const startAngle = i * degreesPerSector;
                        const endAngle = (i + 1) * degreesPerSector;
                        gradientStrings.push(`${colorString} ${startAngle}deg ${endAngle}deg`);
                    }
                    wheel.style.background = `conic-gradient(from 0deg, ${gradientStrings.join(', ')})`;
                });
                
                const highlightStartAngle = randomSectorIndex * degreesPerSector;
                const highlightEndAngle = (randomSectorIndex + 1) * degreesPerSector;
                dynamicWheels.forEach((wheel) => {
                    const ring = wheel.querySelector('.wheel-highlight');
                    if (ring) {
                        ring.style.background = `
                            conic-gradient(
                                from 0deg,
                                transparent 0deg ${highlightStartAngle}deg,
                                var(--mcm-brass) ${highlightStartAngle}deg ${highlightStartAngle + 1.5}deg,
                                transparent ${highlightStartAngle + 1.5}deg ${highlightEndAngle - 1.5}deg,
                                var(--mcm-brass) ${highlightEndAngle - 1.5}deg ${highlightEndAngle}deg,
                                transparent ${highlightEndAngle}deg 360deg
                            )
                        `;
                    }
                });
                
                const conditionText = Math.random() < 0.5 ? 'darker' : 'lighter';
                let correctCount = conditionText === 'darker' ? randomSectorIndex : (totalSectors - 1 - randomSectorIndex);
                let correctPercentage = Math.round((correctCount / totalSectors) * 100 * 100) / 100;
                promptContent.style.whiteSpace = "normal";

                // Lock down the spin button by default in Shades mode initialization
                spinBtn.disabled = true;

                promptContent.innerHTML = `
                    <div style="margin-bottom: 18px;">
                        What are the spatial chances the layout will stop on a sector 
                        <strong style="color: var(--mcm-brass);">${conditionText}</strong> 
                        than the targeted index 
                        <span class="shade-slice" style="background-color: ${pulledShadeColor};"></span>?
                    </div>

                    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                        <input type="number" id="shades-answer-input" class="bet-input" placeholder="0.00" step="0.01" style="width: 100px;">
                        <span style="color: #fff; font-weight: 800; font-size: 16px;">%</span>
                        <button id="shades-check-btn" style="background: transparent; border: 1px solid var(--mcm-brass); color: var(--mcm-brass); padding: 8px 16px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; border-radius: 2px;">
                            Check
                        </button>
                        <span id="shades-feedback" style="font-weight: 800; font-size: 15px;"></span>
                    </div>

                    <div style="font-size: 11px; color: #6b7280; margin-top: 10px;">
                        (Standard numeric constraints: Round to two decimal places)
                    </div>

                    <div class="bet-container" id="shades-bet-area" style="opacity: 0.4; cursor: not-allowed;">
                        <label style="font-size: 12px; font-weight:600; color: var(--mcm-brass); text-transform: uppercase; cursor: inherit;">
                            Bet Amount:
                        </label>
                        <div class="bet-input-wrapper" style="cursor: inherit;">
                            
                            <input type="number" id="shades-bet-field" class="bet-input" value="100" min="1" max="${fakeBalance}" disabled style="cursor: inherit;">
                            <span style="font-size:12px; color:#6b7280;">(Max: $${fakeBalance.toLocaleString()} )</span>
                        </div>
                    </div>
                `;

                const checkBtn = document.getElementById('shades-check-btn');
                const ansInput = document.getElementById('shades-answer-input');
                const feedback = document.getElementById('shades-feedback');

                checkBtn.addEventListener('click', () => {
                    let userAns = parseFloat(ansInput.value);
                    if (isNaN(userAns)) return;

                    const oldBanner = promptContent.querySelector('.outcome-banner');
                    if (oldBanner) oldBanner.remove();

                    let correct = Math.abs(userAns - correctPercentage) < 0.05;

                    if (!correct) {
                        feedback.innerHTML = `<span style="color: #ef4444; margin-left: 5px;">Try Again</span>`;
                        window.activeShadesBet = null;
                        spinBtn.disabled = true; // Reinforce disabled state on incorrect entry
                        return;
                    }

                    feedback.innerHTML = `<span style="color: #10b981; margin-left: 5px;">Correct</span>`;
                    
                    // Light up and unlock the allocation input, panel background, and spin button
                    const shadesBetArea = document.getElementById('shades-bet-area');
                    const shadesBetField = document.getElementById('shades-bet-field');
                    if (shadesBetArea && shadesBetField) {
                        shadesBetField.disabled = false;
                        shadesBetArea.style.opacity = "1";
                        shadesBetArea.style.cursor = "auto";
                        shadesBetField.style.cursor = "auto";
                    }

                    // Unlock the spin button
                    spinBtn.disabled = false;

                    window.activeShadesBet = {
                        condition: conditionText,
                        targetIndex: randomSectorIndex
                    };

                    const banner = document.createElement('div'); 
                    promptContent.appendChild(banner);
                });

                ansInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        checkBtn.click();
                    }
                });
            }
            else if (mode === 'multicolor') {
                if (dynamicWheels.length < 2) return;
                let topGradientStrings = [];
                let currentAngle = 0;

                colorPalette.forEach((item, index) => {
                    const pct = currentMulticolorPercentages[index];
                    const targetAngleSpan = (pct / 100) * 360;
                    const startAngle = currentAngle;
                    const endAngle = currentAngle + targetAngleSpan;
                    topGradientStrings.push(`${item.color} ${startAngle.toFixed(1)}deg ${endAngle.toFixed(1)}deg`);
                    currentAngle = endAngle;
                });
                dynamicWheels[0].style.background = `conic-gradient(from 0deg, ${topGradientStrings.join(', ')})`;

                if (bottomWheelPickedColors.length === 0) {
                    while (bottomWheelPickedColors.length < 4) {
                        let randIndex = Math.floor(Math.random() * colorPalette.length);
                        if (!bottomWheelPickedColors.includes(randIndex)) {
                            bottomWheelPickedColors.push(randIndex);
                        }
                    }
                }

                let bottomGradientStrings = [];
                let currentBottomAngle = 0;
                bottomWheelPickedColors.forEach((paletteIdx, i) => {
                    const colorHex = colorPalette[paletteIdx].color;
                    const pct = currentBottomWheelPercentages[i];
                    const targetAngleSpan = (pct / 100) * 360;
                    const startAngle = currentBottomAngle;
                    const endAngle = currentBottomAngle + targetAngleSpan;
                    bottomGradientStrings.push(`${colorHex} ${startAngle.toFixed(1)}deg ${endAngle.toFixed(1)}deg`);
                    currentBottomAngle = endAngle;
                });
                dynamicWheels[1].style.background = `conic-gradient(from 0deg, ${bottomGradientStrings.join(', ')})`;

                promptContent.style.whiteSpace = "normal";
                promptContent.innerHTML = `Pick which color is most likely to be landed on:`;
                const listContainer = document.createElement('ul');
                listContainer.classList.add('color-selector-list');
                colorPalette.forEach((item, index) => {
                    const topPct = currentMulticolorPercentages[index];
                    const bIndex = bottomWheelPickedColors.indexOf(index);
                    const isPickedOnBottom = bIndex !== -1;
                    const bottomPct = isPickedOnBottom ? currentBottomWheelPercentages[bIndex] : 0;
                    
                    const listItem = document.createElement('li');
                    listItem.classList.add('color-selector-item');
                    if (index === selectedMulticolorIndex) {
                        listItem.classList.add('selected');
                    }

                    listItem.innerHTML = `
                        <span class="color-swatch-badge" style="background-color: ${item.color};"></span>
                        <div style="flex-grow: 1;">
                            <strong>${item.name} Segment</strong>
                            ${isPickedOnBottom ? '<span style="font-size:11px; color:var(--mcm-brass); margin-left:8px; font-weight:600;">(On both wheels)</span>' : ''}
                        </div>
                        <div style="font-weight: 800; color: #fff;">Left: ${topPct}% | Right: ${bottomPct}%</div>
                    `;

                    listItem.addEventListener('click', () => {
                        if (isSpinning) return;
                        selectedMulticolorIndex = index;
                        const activeItems = listContainer.querySelectorAll('.color-selector-item');
                        activeItems.forEach(ai => ai.classList.remove('selected'));
                        listItem.classList.add('selected');
                        highlightMulticolorSectors();
                    });

                    listContainer.appendChild(listItem);
                });

                promptContent.appendChild(listContainer);

                const betContainer = document.createElement('div');
                betContainer.classList.add('bet-container');
                betContainer.innerHTML = `
                    <label style="font-size: 12px; font-weight:600; color: var(--mcm-brass); text-transform: uppercase;">Bet Amount:</label>
                    <div class="bet-input-wrapper">
                        
                        <input type="number" id="mcm-bet-field" class="bet-input" value="100" min="1" max="${fakeBalance}">
                        <span style="font-size:12px; color:#6b7280;">(Max: $${fakeBalance.toLocaleString()})</span>
                    </div>
                `;
                promptContent.appendChild(betContainer);
                highlightMulticolorSectors();
                spinBtn.disabled = false;
            }
        }

        updateBalanceUI();
        buildWheels();
    </script>
</body>
</html>
